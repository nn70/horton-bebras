<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Horton Bebras 挑戰賽</title><style>:root{--bg:#f7f8fb;--card:#fff;--text:#18202b;--muted:#64748b;--line:#e5e7eb;--accent:#0f766e;--accent2:#ccfbf1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;background:#fffffff5;border-bottom:1px solid var(--line);z-index:10}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:14px}.timer{font-size:22px;font-weight:800;padding:10px 14px;border-radius:14px;background:var(--accent2)}.hero,.card,.result{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0}.meta{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#f1f5f9;padding:6px 10px;border-radius:999px;font-size:13px}.qnum{font-size:13px;color:var(--muted);font-weight:700}.qtitle{font-size:19px;font-weight:800;margin:8px 0 14px}.story{line-height:1.7;white-space:pre-line}.choices{display:grid;gap:10px;margin-top:14px}.choice{border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;gap:10px}.section-label{margin-top:28px;font-size:18px;font-weight:800}.actions{display:flex;justify-content:center;gap:12px;margin:28px 0 50px}button{border:0;border-radius:14px;padding:13px 20px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#e2e8f0}.hidden{display:none}.score{font-size:40px;font-weight:900}.explain{margin-top:12px;padding:12px 0 0 12px;border-top:1px solid var(--line);line-height:1.65}.answerline{font-weight:800}.wrong-card{border-left:5px solid #ef4444}.right-card{border-left:5px solid #22c55e}footer{color:var(--muted);text-align:center;padding:0 20px 34px;font-size:13px}</style></head><body>
<header><div class="wrap top"><div><h1>Horton Bebras 挑戰賽</h1><div class="sub">五、六年級模擬題｜Week 3</div></div><div id="timer" class="timer">36:00</div></div></header><main class="wrap"><section class="hero"><h2>本週新挑戰</h2><p>共 12 題，36 分鐘。所有題目均為本週全新情境；交卷後顯示答案、解析與能力分類。</p><div class="meta"><span class="pill">12 題</span><span class="pill">36 分鐘</span><span class="pill">Bebras 風格</span><span class="pill">Week 3</span></div></section><form id="quiz"></form><div class="actions"><button class="primary" id="submitBtn" type="button">交卷看成績</button><button class="secondary" id="resetBtn" type="button">重新作答</button></div><section id="result" class="result hidden"></section></main><footer>依 Bebras 運算思維風格自製，非官方題庫。</footer><script>
const questions=[
{level:'簡單',title:'太空車指令',text:'太空車一開始面向北。指令 F=前進1格、R=向右轉90度、L=向左轉90度。執行 F R F F L F 後，相對起點在哪裡？',choices:['東2、北2','東2、北1','東1、北2','西2、北2'],answer:0,explain:'先北1；右轉後向東前進2格；左轉後再向北1格。因此合計東2、北2。',skill:'演算法／規則模擬'},
{level:'簡單',title:'魔法印章',text:'印章規則：看到紅色就寫 R，藍色寫 B；但每寫完兩個字母，就把下一個字母重複一次。顏色依序為 紅、藍、紅、藍。最後寫出的字串是？',choices:['RBRB','RBRRB','RBBRB','RBRBB'],answer:1,explain:'前兩個得到 RB；第三個是下一個字母R，要重複成RR；最後藍色寫B，所以是RBRRB。',skill:'規則追蹤'},
{level:'簡單',title:'倉庫編號',text:'倉庫用三個燈表示編號，從左到右的值是4、2、1。亮燈算入、暗燈不算。若狀態是「亮、暗、亮」，代表哪個數字？',choices:['3','4','5','6'],answer:2,explain:'亮的第一盞值4，加上亮的第三盞值1，得到5。',skill:'編碼／二進位概念'},
{level:'簡單',title:'排隊換位',text:'隊伍目前是 4、1、3、2。每次只能交換相鄰且順序顛倒的一對。要排成 1、2、3、4，至少交換幾次？',choices:['2','3','4','5'],answer:2,explain:'逆序為(4,1)、(4,3)、(4,2)、(3,2)，共4組；每次相鄰交換消除一組，因此至少4次。',skill:'排序／最少操作'},
{level:'中等',title:'山洞捷徑',text:'道路皆可雙向通行：A-B、A-C、B-D、C-E、D-F、E-F、B-E。從 A 到 F 最少走幾段道路？',choices:['2','3','4','5'],answer:1,explain:'例如 A-B-D-F 或 A-C-E-F，都是3段；A沒有直接連到D、E、F，所以不可能只走2段。',skill:'路徑／圖論'},
{level:'中等',title:'果汁機程式',text:'杯中數字從3開始，重複3次：若數字小於5就加2；否則減3。最後數字是多少？',choices:['2','4','5','7'],answer:1,explain:'3<5，所以3→5；5不小於5，所以5→2；2<5，所以2→4。',skill:'條件判斷／流程追蹤'},
{level:'中等',title:'科展攤位',text:'甲、乙、丙、丁四個攤位排成一列。甲必須在乙左邊；丙不能在兩端；丁必須和甲相鄰。下列哪個排列符合全部規則？',choices:['丁-甲-丙-乙','甲-丁-乙-丙','乙-丙-丁-甲','丙-甲-丁-乙'],answer:0,explain:'A中甲在乙左邊、丙位於第3格不是兩端、丁與甲相鄰。B的丙在末端；C甲在乙右邊；D丙在第一格。只有A符合。',skill:'限制條件／邏輯推理'},
{level:'中等',title:'海狸圖案',text:'圖案依規則成長：第1列是 ●；第2列是 ●▲●；第3列是 ●▲●▲●。照相同規則，第5列共有幾個符號？',choices:['7','8','9','10'],answer:2,explain:'每增加一列就增加「▲●」兩個符號，長度依序1、3、5、7、9，因此第5列有9個。',skill:'模式辨識'},
{level:'困難',title:'機器人工作站',text:'任務 W、X、Y、Z 的規則：W 必須先完成；X 必須在 Y 前；Y 與 Z 都必須在 W 後。哪個順序可行？',choices:['X-Y-Z-W','W-Z-Y-X','W-X-Z-Y','Z-W-X-Y'],answer:2,explain:'C中W最先，X在Y之前，且Y、Z都在W之後。其他選項至少違反一項。',skill:'排程／依賴關係'},
{level:'困難',title:'猜神秘數字',text:'神秘數字一定是1到16中的一個。每次只能問一個答案為「是／否」的問題，但問題可自由設計。若採最佳策略，保證找出數字至少需要問幾次？',choices:['3','4','5','8'],answer:1,explain:'一次是非問題最多把可能性分成兩半。16→8→4→2→1，需要4次。',skill:'搜尋策略／資訊量'},
{level:'困難',title:'島嶼橋梁',text:'六座島分成三群：{A,B,C}彼此已連通、{D,E}彼此已連通、{F}單獨一群。每座新橋可連接任意兩座島。至少新增幾座橋，才能讓六座島全部互通？',choices:['1','2','3','4'],answer:1,explain:'目前有3個互不相連的群組。每座橋最多把兩群合成一群，因此3群要變1群至少需2座橋，而且確實可用2座完成。',skill:'圖論／連通性'},
{level:'困難',title:'秘密門開關',text:'門的規則是：「A與B恰好一個為開，而且C必須關」，門才打開。現在A關、B開、C關。依序切換A，再切換B，最後門是？',choices:['打開','關閉','無法判斷','會閃爍'],answer:0,explain:'開始A關B開C關符合規則。切A後A、B都開而關門；再切B後A開B關C關，又恰好A、B一個開且C關，所以最後打開。',skill:'布林邏輯／狀態追蹤'}];
const quiz=document.getElementById('quiz');let lastLevel='';questions.forEach((q,i)=>{if(q.level!==lastLevel){const s=document.createElement('div');s.className='section-label';s.textContent=q.level+'題';quiz.appendChild(s);lastLevel=q.level}const c=document.createElement('section');c.className='card';c.innerHTML=`<div class="qnum">第 ${i+1} 題 · ${q.skill}</div><div class="qtitle">${q.title}</div><div class="story">${q.text}</div><div class="choices">${q.choices.map((ch,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}"><span>${String.fromCharCode(65+j)}. ${ch}</span></label>`).join('')}</div>`;quiz.appendChild(c)});let seconds=2160;let timerId=setInterval(()=>{seconds--;renderTimer();if(seconds<=0){clearInterval(timerId);submitQuiz(true)}},1000);function renderTimer(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function submitQuiz(auto=false){clearInterval(timerId);let score=0,answered=0;const details=[];questions.forEach((q,i)=>{const el=document.querySelector(`input[name=q${i}]:checked`),v=el?Number(el.value):null;if(v!==null)answered++;if(v===q.answer)score++;details.push({v,q,i})});const result=document.getElementById('result');result.classList.remove('hidden');const pct=Math.round(score/questions.length*100);result.innerHTML=`<h2>${auto?'時間到，自動交卷':'完成！'}</h2><div class="score">${score} / ${questions.length}</div><p>作答 ${answered} 題，正確率 ${pct}%</p><h3>逐題解析</h3>`+details.map(d=>`<div class="explain ${d.v===d.q.answer?'right-card':'wrong-card'}"><div class="answerline">第 ${d.i+1} 題：${d.v===d.q.answer?'✅ 正確':'❌ 錯誤或未作答'}</div><div>正確答案：${String.fromCharCode(65+d.q.answer)}. ${d.q.choices[d.q.answer]}</div><div>${d.q.explain}</div><div class="sub">能力：${d.q.skill}</div></div>`).join('');result.scrollIntoView({behavior:'smooth'})}document.getElementById('submitBtn').onclick=()=>submitQuiz(false);document.getElementById('resetBtn').onclick=()=>location.reload();renderTimer();
</script></body></html>

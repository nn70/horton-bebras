<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Horton Bebras 挑戰賽</title><style>:root{--bg:#f7f8fb;--card:#fff;--text:#18202b;--muted:#64748b;--line:#e5e7eb;--accent:#0f766e;--accent2:#ccfbf1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;background:#fffffff5;border-bottom:1px solid var(--line);z-index:10}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:14px}.timer{font-size:22px;font-weight:800;padding:10px 14px;border-radius:14px;background:var(--accent2)}.hero,.card,.result{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0}.meta{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#f1f5f9;padding:6px 10px;border-radius:999px;font-size:13px}.qnum{font-size:13px;color:var(--muted);font-weight:700}.qtitle{font-size:19px;font-weight:800;margin:8px 0 14px}.story{line-height:1.7;white-space:pre-line}.choices{display:grid;gap:10px;margin-top:14px}.choice{border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;gap:10px}.section-label{margin-top:28px;font-size:18px;font-weight:800}.actions{display:flex;justify-content:center;gap:12px;margin:28px 0 50px}button{border:0;border-radius:14px;padding:13px 20px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#e2e8f0}.hidden{display:none}.score{font-size:40px;font-weight:900}.explain{margin-top:12px;padding:12px 0 0 12px;border-top:1px solid var(--line);line-height:1.65}.answerline{font-weight:800}.wrong-card{border-left:5px solid #ef4444}.right-card{border-left:5px solid #22c55e}footer{color:var(--muted);text-align:center;padding:0 20px 34px;font-size:13px}</style></head><body>
<header><div class="wrap top"><div><h1>Horton Bebras 挑戰賽</h1><div class="sub">五、六年級模擬題｜Week 2</div></div><div id="timer" class="timer">36:00</div></div></header><main class="wrap"><section class="hero"><h2>準備好了嗎？</h2><p>共 12 題，建議 36 分鐘內完成。題目分成簡單、中等、困難，重點是運算思維，不需要會寫程式才能作答。</p><div class="meta"><span class="pill">12 題</span><span class="pill">36 分鐘</span><span class="pill">Bebras 風格</span><span class="pill">交卷後看解析</span></div></section><form id="quiz"></form><div class="actions"><button class="primary" id="submitBtn" type="button">交卷看成績</button><button class="secondary" id="resetBtn" type="button">重新作答</button></div><section id="result" class="result hidden"></section></main><footer>依 Bebras 運算思維風格自製，非官方題庫。</footer><script>
const questions=[
{level:'簡單',title:'森林送信機器人',text:'機器人面向東方，依序執行：前進 1 格 → 左轉 → 前進 2 格 → 右轉 → 前進 1 格。\n\n最後相對於起點在哪裡？',choices:['東2、北2','東2、南2','東1、北2','北3'],answer:0,explain:'先向東1格，再向北2格，右轉後向東1格，因此總共東2格、北2格。',skill:'演算法／規則模擬'},
{level:'簡單',title:'彩燈控制器',text:'燈一開始是關的。每收到一次 X 就切換開／關；收到 Y 則保持不變。\n\n指令 XXYXXX 執行完後，燈是？',choices:['開','關','無法判斷','閃爍'],answer:0,explain:'共有5個X，切換奇數次，所以由關變成開；Y不影響。',skill:'狀態模擬'},
{level:'簡單',title:'圖形密碼',text:'規則是 ▲=1、●=0。四個符號 ▲●▲▲ 代表哪個二進位字串？',choices:['1011','0100','1101','1001'],answer:0,explain:'逐一替換後得到1011。',skill:'編碼／資料表示'},
{level:'簡單',title:'書架排序',text:'四本書編號 8、3、6、2。每次只能交換相鄰兩本書。要排成 2、3、6、8，至少交換幾次？',choices:['2','3','4','5'],answer:3,explain:'逆序共有5組：8與3、6、2；3與2；6與2。相鄰交換每次最多消除一個逆序，所以至少5次。',skill:'排序／最少操作'},
{level:'中等',title:'島嶼渡船',text:'單向航線：A→B、A→C、B→D、C→D、C→E、E→F、D→F。\n從 A 到 F 最少經過幾段航線？',choices:['2','3','4','5'],answer:1,explain:'A→B→D→F，共3段；不存在2段路徑。',skill:'路徑／圖論'},
{level:'中等',title:'數字加工廠',text:'從 x=4 開始，重複 3 次：如果 x 是偶數就 x=x÷2；如果 x 是奇數就 x=x+3。\n最後 x 是多少？',choices:['1','2','4','5'],answer:2,explain:'4→2→1→4，所以答案是4。',skill:'條件判斷／流程追蹤'},
{level:'中等',title:'社團座位',text:'A、B、C、D 四人坐一排。A 不能坐兩端；B 必須在 C 左邊；D 不能和 C 相鄰。哪個排列符合？',choices:['B-A-C-D','C-A-B-D','D-A-B-C','B-D-A-C'],answer:3,explain:'B-D-A-C 同時符合三項限制。',skill:'限制條件／邏輯推理'},
{level:'中等',title:'重複字串',text:'字串從 A 開始。每一輪把目前字串中的 A 換成 AB，把 B 換成 A（同時替換）。做兩輪後是什麼？',choices:['ABA','ABB','BAA','ABAB'],answer:0,explain:'第1輪A→AB；第2輪原本A→AB、B→A，得到ABA。',skill:'規則轉換／模式辨識'},
{level:'困難',title:'任務依賴',text:'四個任務：P 要先於 R；Q 要先於 R；R 要先於 S。一次只能做一個任務。下列哪個順序不可能？',choices:['P,Q,R,S','Q,P,R,S','P,R,Q,S','Q,P,R,S'],answer:2,explain:'P,R,Q,S 中 R 在 Q 之前，違反 Q 要先於 R。',skill:'排程／依賴關係'},
{level:'困難',title:'最少測試',text:'有8個編號盒子，只有1個有寶物。每次可以問一個只能回答「是／否」的問題，而且問題可自由設計。保證找到寶物最少需要問幾次？',choices:['2','3','4','8'],answer:1,explain:'每次最多把可能性減半：8→4→2→1，需要3次。',skill:'資訊量／搜尋策略'},
{level:'困難',title:'校園網路',text:'五台電腦 A、B、C、D、E 要互相連通。已有連線 A-B、B-C、C-D。若每新增一條線都可任選兩台，至少還需幾條才能讓五台全部互通？',choices:['1','2','3','4'],answer:0,explain:'A-B-C-D 已連成一群，只需把E用一條線接入。',skill:'圖論／連通性'},
{level:'困難',title:'機器人寶箱',text:'三個開關 X、Y、Z。寶箱只有在「恰好兩個開關是開」時打開。現在 X 開、Y 關、Z 開。依序切換 Y、再切換 X，最後寶箱狀態是？',choices:['打開','關閉','先關再開','無法判斷'],answer:0,explain:'開始2個開；切Y後3個開；再切X後剩Y、Z兩個開，因此最後打開。',skill:'布林邏輯／狀態追蹤'}];
const quiz=document.getElementById('quiz');let lastLevel='';questions.forEach((q,i)=>{if(q.level!==lastLevel){const s=document.createElement('div');s.className='section-label';s.textContent=q.level+'題';quiz.appendChild(s);lastLevel=q.level}const c=document.createElement('section');c.className='card';c.innerHTML=`<div class="qnum">第 ${i+1} 題 · ${q.skill}</div><div class="qtitle">${q.title}</div><div class="story">${q.text}</div><div class="choices">${q.choices.map((ch,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}"><span>${String.fromCharCode(65+j)}. ${ch}</span></label>`).join('')}</div>`;quiz.appendChild(c)});let seconds=2160;let timerId=setInterval(()=>{seconds--;renderTimer();if(seconds<=0){clearInterval(timerId);submitQuiz(true)}},1000);function renderTimer(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function submitQuiz(auto=false){clearInterval(timerId);let score=0,answered=0;const details=[];questions.forEach((q,i)=>{const el=document.querySelector(`input[name=q${i}]:checked`),v=el?Number(el.value):null;if(v!==null)answered++;if(v===q.answer)score++;details.push({v,q,i})});const result=document.getElementById('result');result.classList.remove('hidden');const pct=Math.round(score/questions.length*100);result.innerHTML=`<h2>${auto?'時間到，自動交卷':'完成！'}</h2><div class="score">${score} / ${questions.length}</div><p>作答 ${answered} 題，正確率 ${pct}%</p><h3>逐題解析</h3>`+details.map(d=>`<div class="explain ${d.v===d.q.answer?'right-card':'wrong-card'}"><div class="answerline">第 ${d.i+1} 題：${d.v===d.q.answer?'✅ 正確':'❌ 錯誤或未作答'}</div><div>正確答案：${String.fromCharCode(65+d.q.answer)}. ${d.q.choices[d.q.answer]}</div><div>${d.q.explain}</div><div class="sub">能力：${d.q.skill}</div></div>`).join('');result.scrollIntoView({behavior:'smooth'})}document.getElementById('submitBtn').onclick=()=>submitQuiz(false);document.getElementById('resetBtn').onclick=()=>location.reload();renderTimer();
</script></body></html>
